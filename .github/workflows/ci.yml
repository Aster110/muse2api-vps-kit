name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: shell
        run: |
          bash -n install.sh
          shellcheck -x install.sh
      - name: python
        run: |
          python -m py_compile smoke.py login/muse_login.py meter/muse_meter.py tests/*.py
          python tests/test_kit.py
